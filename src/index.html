<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo App</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }

      main {
        width: min(680px, calc(100% - 32px));
        padding: 32px;
        border: 1px solid #d8dee9;
        border-radius: 8px;
        background: white;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }

      code {
        padding: 3px 6px;
        border-radius: 4px;
        background: #eef2f7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Demo App by Van Phu Tin</h1>

      <p>Version source: <code>app-repo</code></p>
    </main>
  </body>
</html>
